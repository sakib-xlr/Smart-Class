<VirtualHost *:${PORT:-80}>
    DocumentRoot /app
    DirectoryIndex index.php index.html

    <Directory /app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Pass Railway's PORT env var to Apache
    Listen ${PORT:-80}

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
